[workspace]
resolver = "2"
members = [
    # JF reader crate (with its own internal workspace for sub-crates)
    "src/crates/jf/error",
    "src/crates/jf/journal_file",
    "src/crates/jf/journal_reader_ffi",
    "src/crates/jf/window_manager",
    "src/crates/jf/sigbus",

    # Core journal crates
    "src/crates/journal-common",
    "src/crates/journal-core",
    "src/crates/journal-host",
    "src/crates/journal-index",
    "src/crates/journal-log-writer",
    "src/crates/journal-registry",
    "src/crates/journal-engine",

    # Public SDK
    "src/journal",

    # CLI tools
    "src/cmd/journalctl",
    "src/internal/testcmd/livewriter",
    "src/internal/testcmd/dataset_ingester",
    "src/internal/testcmd/writer_core_bench",
    "src/internal/testcmd/reader_core_bench",
    "src/internal/testcmd/corpus_digest",
    "src/internal/testcmd/corpus_regenerate",
    "src/internal/testcmd/corpus_experiment",
    "src/internal/testcmd/netdata_function_wrapper",

    # Conformance adapter
    "src/adapter",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
homepage = "https://github.com/netdata/systemd-journal-sdk"
repository = "https://github.com/netdata/systemd-journal-sdk"

[workspace.lints.clippy]
collapsible_if = "allow"

# Core workspace dependencies
[workspace.dependencies]
# Error handling
thiserror = "2.0.19"
anyhow = "1.0.104"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Memory mapping
memmap2 = "0.9.11"

# Zero-copy deserialization
zerocopy = { version = "0.9.0-alpha.0", features = ["derive"] }

# Hashing
siphasher = "1.0.3"
hashers = "1.0.1"
rustc-hash = "2.1.3"

# Compression
ruzstd = "0.9.0"
zstd = { version = "0.13.3", default-features = false }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-decode", "checked-decode"] }
lzma-rust2 = { version = "0.18.0", default-features = false, features = ["std", "xz", "encoder"] }

# Random
rand = "0.10.2"

# Utilities
static_assertions = "1.1.0"
hex = "0.4.3"
libc = "0.2.189"
base64 = "0.23.0"
parking_lot = "0.12.5"
walkdir = "2.5.0"
regex = "1.13.1"
itoa = "1.0.18"
ouroboros = "0.18.5"

# Async
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3.33"
tokio-util = { version = "0.7.19", features = ["codec"] }

# Tracing
tracing = { version = "0.1.44" }
tracing-subscriber = "0.3.23"

# Time
chrono = { version = "0.4.45", features = ["serde"] }

# UUID
uuid = { version = "1.24.0", features = ["v4", "rng", "serde"] }

# System
windows-sys = { version = "0.61.2", default-features = false }

# File watching
notify = "8.2.0"

# Collections
roaring = "0.11.4"

# Caching
lru = "0.18.1"
foyer = { version = "0.22.3", features = ["serde"] }

# Memory analysis
allocative = "0.3.6"

# Dev/test utilities
tempfile = "3.27.0"
clap = { version = "4.6.4", features = ["derive"] }
rayon = "1.12.0"
cbindgen = "0.29.4"

# Cryptography (FSPRG)
num-bigint = "0.5.1"
sha2 = "0.11.0"
hmac = "0.13.0"

# Internal crate path dependencies
journal-common = { package = "systemd-journal-sdk-common", version = "0.10.0", path = "src/crates/journal-common" }
journal-registry = { package = "systemd-journal-sdk-registry", version = "0.10.0", path = "src/crates/journal-registry" }
journal-core = { package = "systemd-journal-sdk-core", version = "0.10.0", path = "src/crates/journal-core" }
journal-index = { package = "systemd-journal-sdk-index", version = "0.10.0", path = "src/crates/journal-index" }
journal-log-writer = { package = "systemd-journal-sdk-log-writer", version = "0.10.0", path = "src/crates/journal-log-writer" }

[profile.dev]
opt-level = 1
debug = true
debug-assertions = true

[profile.release]
debug = true
opt-level = 3
lto = "fat"
codegen-units = 1
