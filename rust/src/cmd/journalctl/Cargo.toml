[package]
name = "journalctl"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "File-backed journalctl rewrite with native PCRE2"
license.workspace = true

[[bin]]
name = "journalctl"
path = "main.rs"

[dependencies]
journal = { package = "systemd-journal-sdk", path = "../../journal" }
journal-core = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
jiff = { version = "=0.2.38", features = ["tzdb-bundle-always"] }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
