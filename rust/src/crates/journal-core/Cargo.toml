[package]
name = "systemd-journal-sdk-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Core pure Rust systemd journal file reader and writer primitives"
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/systemd-journal-sdk-core"
readme = "../../../README.md"
keywords = ["systemd", "journal", "logging", "sdk"]
categories = ["filesystem", "parser-implementations"]

[lib]
name = "journal_core"

[lints]
workspace = true

[features]
allocative = ["dep:allocative"]

[dependencies]
journal-common = { workspace = true }
journal-registry = { workspace = true }

# Core dependencies
static_assertions = { workspace = true }
thiserror = { workspace = true }
zerocopy = { workspace = true , features = ["derive"] }
libc = { workspace = true }
memmap2 = { workspace = true }
uuid = { workspace = true , features = ["v4", "rng", "serde"] }

# File format dependencies
ruzstd = { workspace = true }
zstd = { workspace = true }
siphasher = { workspace = true }

lz4_flex = { workspace = true }
lzma-rust2 = { workspace = true }

serde = { workspace = true, features = ["derive"] }

rustc-hash = { workspace = true }

# Registry dependencies
serde_json = { workspace = true }

tracing = { workspace = true }
allocative = { workspace = true, optional = true }

# FSPRG dependencies
num-bigint = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = { workspace = true }
hex = { workspace = true }
